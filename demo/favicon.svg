<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Rounded Squircle Base -->
  <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#bgGrad)" filter="url(#glow)"/>
  
  <!-- Subtle Grid Pattern -->
  <line x1="2" y1="20" x2="30" y2="20" stroke="rgba(255,255,255,0.12)" stroke-width="0.75" stroke-dasharray="2 2" />
  
  <!-- Area Glow fill below curve -->
  <path d="M 6 22 C 10 22, 11 13, 15 16 C 19 19, 21 8, 26 7 L 26 23 L 6 23 Z" fill="rgba(255,255,255,0.15)" />

  <!-- Smooth Sparkline Curve -->
  <path d="M 6 22 C 10 22, 11 13, 15 16 C 19 19, 21 8, 26 7" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Accent Endpoint Dot -->
  <circle cx="26" cy="7" r="2.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.2" />
</svg>
