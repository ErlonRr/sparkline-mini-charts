name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# One run per PR (or per ref on push); a newer push cancels the stale run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      # Third-party actions are pinned by full commit SHA; the comment names the release.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from "packageManager" in the root package.json (a private
      # workspace root; the published library is packages/core, the demo apps/demo).
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # No host style writes, no HTML string sinks, no app-level custom properties in src/.
      - name: Source checks
        run: pnpm run lint:source

      # README, docs/ and the demo use only attributes, tokens and parts that exist in src/,
      # every chart page documents its whole API, and the root README.md and LICENSE are
      # copies of the packages/core ones.
      - name: Docs checks
        run: pnpm run lint:docs

      - name: Unit tests
        run: pnpm run test:unit

      - name: Build library
        run: pnpm run build

      # The public API of every entry must match the reports in api/ (see "API reports" in CONTRIBUTING.md).
      - name: API report
        run: pnpm run api:check

      # publint + attw on the packed tarball; see "Package lint" in CONTRIBUTING.md.
      - name: Lint package
        run: pnpm run lint:package

      - name: Package tests
        run: pnpm run test:package

      # The files and the exports map `npm pack` of packages/core would publish, against the
      # latest version on npm: no file or export may disappear in a 1.x release.
      - name: Compare packed contents with the npm release
        run: pnpm run compare-pack --skip-build --against "$(npm view sparkline-mini-charts version)"

      - name: Build demo
        run: pnpm run build:demo

      # Browser tests of the built demo (smoke + accessibility blockers), on one Node version.
      # The Playwright version comes from the lockfile; --with-deps installs the system libraries.
      - name: Install Playwright Chromium
        if: matrix.node == 24
        run: pnpm --filter sparkline-mini-charts-demo exec playwright install --with-deps chromium

      - name: Demo browser tests
        if: matrix.node == 24
        run: pnpm run test:e2e
