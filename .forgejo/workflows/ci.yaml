name: CI

on:
  push:

jobs:
  build-test:
    runs-on: batcave-node22

    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build library
        run: pnpm run build

      - name: Build demo
        run: pnpm run build:demo

      - name: Deploy demo
        run: |
          mkdir -p /deploy/sparkline-mini-charts
          rm -rf /deploy/sparkline-mini-charts/*
          cp -a dist-demo/. /deploy/sparkline-mini-charts/

      - name: Verify deploy
        run: |
          echo "=== DEPLOY ==="
          ls -la /deploy
          echo "=== SPARKLINE ==="
          ls -la /deploy/sparkline-mini-charts
          echo "=== INDEX ==="
          test -f /deploy/sparkline-mini-charts/index.html
