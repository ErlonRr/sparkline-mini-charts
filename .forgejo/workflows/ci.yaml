name: CI

on:
  push:

# One run per ref: a newer push cancels the stale run on feature branches,
# while runs on main queue instead, so a demo deploy is never interrupted mid-copy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test:
    runs-on: batcave-node22

    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      - name: Build library
        run: pnpm run build

      # publint + attw on the packed tarball; see "Package lint" in CONTRIBUTING.md for the allowlist.
      - name: Lint package
        run: pnpm run lint:package

      - name: Package tests
        run: pnpm run test:package

      - name: Build demo
        run: pnpm run build:demo

      - name: Deploy demo
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /deploy/sparkline-mini-charts
          rm -rf /deploy/sparkline-mini-charts/*
          cp -a dist-demo/. /deploy/sparkline-mini-charts/

      - name: Verify deploy
        if: github.ref == 'refs/heads/main'
        run: |
          ls -la /deploy/sparkline-mini-charts
          test -f /deploy/sparkline-mini-charts/index.html
