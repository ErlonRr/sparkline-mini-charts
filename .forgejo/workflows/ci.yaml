name: CI

on:
  push:

# Checks only: the demo is deployed by Vercel (see vercel.json), and GitHub is the
# canonical repository whose CI gates merges. One run per ref; a newer push cancels
# the stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: batcave-node22

    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # No host style writes, no HTML string sinks, no app-level custom properties in src/.
      - name: Source checks
        run: pnpm run lint:source

      # README, docs/ and the demo use only attributes, tokens and parts that exist in src/,
      # and every chart page documents its whole API.
      - name: Docs checks
        run: pnpm run lint:docs

      - name: Unit tests
        run: pnpm run test:unit

      - name: Build library
        run: pnpm run build

      # The public API of every entry must match the reports in api/ (see "API reports" in CONTRIBUTING.md).
      - name: API report
        run: pnpm run api:check

      # publint + attw on the packed tarball; see "Package lint" in CONTRIBUTING.md.
      - name: Lint package
        run: pnpm run lint:package

      - name: Package tests
        run: pnpm run test:package

      - name: Build demo
        run: pnpm run build:demo
