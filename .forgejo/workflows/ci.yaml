name: CI

on:
  push:

jobs:
  build-test:
    runs-on: batcave-node22

    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build library
        run: pnpm run build
      - name: Build demo
        run: pnpm run build:demo
      - name: Verify deploy mount
        run: |
          echo "=== DEPLOY MOUNT ==="
          ls -la
          ls -la /deploy
