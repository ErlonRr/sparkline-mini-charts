<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Sparkline Mini Charts: 24 zero-dependency SVG chart Web Components that fit in a table cell, theme with CSS variables and work in any framework."
    />
    <title>Sparkline Mini Charts</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Apply a stored theme before the first paint (main.js keeps it in sync afterwards).
      try {
        var theme = localStorage.getItem("smc-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        }
      } catch (error) {
        // Storage blocked: follow the system theme.
      }
    </script>
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="#/">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <rect x="1" y="1" width="30" height="30" rx="9" fill="var(--accent-solid)" />
            <path d="M7 20.5 11.5 15l4 3.5L20 10l5 5" fill="none" stroke="var(--on-accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="brand-name">Sparkline <span>Mini Charts</span></span>
          <span class="badge" data-version></span>
        </a>

        <nav class="primary-nav" aria-label="Primary">
          <ul>
            <li><a href="#/" data-nav="home">Home</a></li>
            <li><a href="#/charts" data-nav="charts">Charts</a></li>
            <li><a href="#/live" data-nav="live">Live</a></li>
            <li><a href="#/theming" data-nav="theming">Theming</a></li>
            <li><a href="#/frameworks" data-nav="frameworks">Frameworks</a></li>
          </ul>
        </nav>

        <div class="header-actions">
          <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch theme" aria-pressed="false">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4.5" />
              <path d="M12 2v2.5M12 19.5V22M4.2 4.2 6 6M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8" />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z" />
            </svg>
          </button>
          <a class="icon-btn" data-github href="https://github.com/ErlonRr/sparkline-mini-charts" aria-label="Source code on GitHub">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-fill">
              <path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.56 9.56 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.75c0 .27.18.58.69.48A10 10 0 0 0 12 2Z" />
            </svg>
          </a>
        </div>
      </div>
    </header>

    <main id="main" tabindex="-1"></main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>
          <strong>Sparkline Mini Charts</strong> <span data-version></span> · MIT License ·
          <a data-github href="https://github.com/ErlonRr/sparkline-mini-charts">GitHub</a> ·
          <a href="https://www.npmjs.com/package/sparkline-mini-charts">npm</a>
        </p>
        <p class="muted">Every chart on this site is a native Web Component rendered in your browser.</p>
      </div>
    </footer>

    <div id="announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
