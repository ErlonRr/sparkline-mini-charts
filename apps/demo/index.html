<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Sparkline Mini Charts: 24 zero-dependency SVG chart Web Components that fit in a table cell, theme with CSS variables and work in any framework."
    />
    <title>Sparkline Mini Charts</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      /* Boot screen: inline, so it paints before styles.css (which Vite dev injects from JS). */
      :root { color-scheme: light dark; }
      html:not(.ready) body > :not(#boot) { visibility: hidden; }
      html:not(.ready) body { background: light-dark(#f6f7fb, #0a0c11); }
      #boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: light-dark(#f6f7fb, #0a0c11); color: light-dark(#4f46e5, #818cf8); opacity: 0; animation: boot-in 0.2s 0.15s forwards; transition: opacity 0.25s; }
      #boot svg { width: 72px; height: 44px; overflow: visible; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      #boot .line { stroke-dasharray: 100; stroke-dashoffset: 100; animation: boot-draw 1.2s ease-in-out infinite; }
      #boot .dot { fill: currentColor; stroke: none; opacity: 0; animation: boot-dot 1.2s ease-in-out infinite; }
      html.ready #boot { opacity: 0; pointer-events: none; animation: none; }
      @keyframes boot-in { to { opacity: 1; } }
      @keyframes boot-draw { 0% { stroke-dashoffset: 100; } 70%, 100% { stroke-dashoffset: 0; } }
      @keyframes boot-dot { 0%, 60% { opacity: 0; } 80%, 100% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #boot .line { animation: none; stroke-dashoffset: 0; } #boot .dot { animation: none; opacity: 1; } }
    </style>
    <noscript><style>html:not(.ready) body > :not(#boot) { visibility: visible; } #boot { display: none; }</style></noscript>
    <script>
      // Apply a stored theme before the first paint (main.js keeps it in sync afterwards).
      try {
        var theme = localStorage.getItem("smc-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        }
      } catch (error) {
        // Storage blocked: follow the system theme.
      }
      // Failsafe: the boot screen never stays more than 3 seconds.
      setTimeout(function () {
        document.documentElement.classList.add("ready");
        setTimeout(function () {
          var boot = document.getElementById("boot");
          if (boot) boot.remove();
        }, 400);
      }, 3000);
    </script>
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading">
      <svg viewBox="0 0 72 44" aria-hidden="true">
        <path class="line" pathLength="100" d="M4 34 18 22l12 8 14-18 12 6 10-12" />
        <circle class="dot" cx="66" cy="6" r="4" />
      </svg>
    </div>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="#/">
          <svg class="brand-mark" width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
            <rect x="1" y="1" width="30" height="30" rx="9" fill="#4f46e5" />
            <path d="M7 20.5 11.5 15l4 3.5L20 10l5 5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="brand-name">Sparkline <span>Mini Charts</span></span>
          <span class="badge" data-version></span>
        </a>

        <nav class="primary-nav" aria-label="Primary">
          <ul>
            <li><a href="#/" data-nav="home"><span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5" /><path d="M6 10.5V19h12v-8.5" /></svg></span><span class="nav-label">Home</span></a></li>
            <li><a href="#/charts" data-nav="charts"><span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19V11M12 19V5M19 19v-5" /></svg></span><span class="nav-label">Charts</span></a></li>
            <li><a href="#/live" data-nav="live"><span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2.5-6 4 12 2.5-6H21" /></svg></span><span class="nav-label">Live</span></a></li>
            <li><a href="#/theming" data-nav="theming"><span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5s6 6.2 6 10.3a6 6 0 0 1-12 0C6 9.7 12 3.5 12 3.5Z" /></svg></span><span class="nav-label">Theming</span></a></li>
            <li><a href="#/frameworks" data-nav="frameworks"><span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 4 8 4.5-8 4.5-8-4.5L12 4Z" /><path d="m4 12.5 8 4.5 8-4.5M4 16.5l8 4.5 8-4.5" /></svg></span><span class="nav-label">Frameworks</span></a></li>
          </ul>
        </nav>

        <div class="header-actions">
          <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch theme" aria-pressed="false">
            <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4.5" />
              <path d="M12 2v2.5M12 19.5V22M4.2 4.2 6 6M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8" />
            </svg>
            <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z" />
            </svg>
          </button>
          <a class="icon-btn" data-github href="https://github.com/ErlonRr/sparkline-mini-charts" aria-label="Source code on GitHub">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" class="icon-fill">
              <path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.56 9.56 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.75c0 .27.18.58.69.48A10 10 0 0 0 12 2Z" />
            </svg>
          </a>
        </div>
      </div>
    </header>

    <main id="main" tabindex="-1"></main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>
          <strong>Sparkline Mini Charts</strong> <span data-version></span> · MIT License ·
          <a data-github href="https://github.com/ErlonRr/sparkline-mini-charts">GitHub</a> ·
          <a href="https://www.npmjs.com/package/sparkline-mini-charts">npm</a>
        </p>
        <p class="muted">Every chart on this site is a native Web Component rendered in your browser.</p>
      </div>
    </footer>

    <div id="announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
